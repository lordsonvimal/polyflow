name: Eval Regression Gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  eval:
    name: Corpus recall regression gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # NOT go-version-file: go.mod. polyflow's own go.mod (`go 1.25.0`)
          # is a floor for *building polyflow*, not a ceiling for what its
          # embedded go/packages.Load can *parse*. The eval corpus's own
          # go/packages call parses source files belonging to third-party
          # corpus repos (e.g. gotify) using whatever go/parser is compiled
          # into this binary — pinning that to 1.25 broke the moment gotify's
          # transitive golang.org/x/crypto dependency shipped a go1.26-only
          # file (fips140only_go1.26.go), well before polyflow's own go.mod
          # had any reason to move: "file requires newer Go version go1.26
          # (application built with go1.25)". A newer toolchain building an
          # older-declared module is always safe (Go toolchains are forward
          # compatible with lower `go` directives); 'stable' keeps this
          # self-healing as corpus repos' own dependencies march forward.
          go-version: 'stable'
          # Cache is handled below by a single step keyed on both this
          # module's go.sum AND the corpus manifests, so setup-go's own
          # (narrower) cache is disabled to avoid two actions/cache steps
          # fighting over the same ~/go/pkg/mod and ~/.cache/go-build paths.
          cache: false

      # ~/go/pkg/mod and ~/.cache/go-build cover both polyflow's own build
      # AND the Go-based corpus repos under eval/.cache (e.g. gotify), which
      # are cloned fresh by `make eval-corpus` below and have their own
      # go.mod/go.sum. Without this, gotify's dependencies must be downloaded
      # from scratch every run; `polyflow index`'s semantic pass
      # (go/packages.Load) silently falls back to tree-sitter-only edges when
      # that download is slow/unavailable, which used to masquerade as a
      # resolver regression (see eval's semantic_fallback gate condition).
      # Keyed on both go.sum files since either can change the module set.
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ hashFiles('go.sum', 'eval/corpus/**/manifest.yaml') }}
          restore-keys: gomod-

      - name: Install zig (cross-compilation toolchain)
        run: |
          sudo snap install zig --classic --beta || \
          (wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz && \
           tar xf zig-linux-x86_64-0.13.0.tar.xz && \
           sudo mv zig-linux-x86_64-0.13.0/zig /usr/local/bin/)

      - name: Build polyflow
        run: CGO_ENABLED=1 go build -o dist/polyflow ./cmd/polyflow

      # Cache eval/.cache so we don't re-clone and re-index on every run.
      # Key rotates when any corpus manifest changes.
      - name: Cache eval corpus
        uses: actions/cache@v4
        with:
          path: eval/.cache
          key: eval-cache-${{ hashFiles('eval/corpus/**/manifest.yaml') }}
          restore-keys: eval-cache-

      - name: Clone and index corpus repos
        run: make eval-corpus

      - name: Run eval corpus + gate against baseline
        run: |
          ./dist/polyflow eval \
            --corpus eval/corpus \
            --output /tmp/current-eval.json \
            --gate eval/baseline.json

      - name: Resolution-yield gate (X.3)
        run: make yield-gate
