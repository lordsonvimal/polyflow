language: javascript
version: "1"
patterns:
  # @_def spans the whole declaration so the matcher can record where the
  # body ends (containment-based enclosing-function attribution).
  - name: function_decl
    query: |
      (function_declaration
        name: (identifier) @name) @_def
    captures:
      - name: name
        role: func_name
  - name: arrow_func_var
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @name
          value: (arrow_function))) @_def
    captures:
      - name: name
        role: func_name

  # foo: function() {} / foo: () => {} — a function assigned as an object
  # property value. Covers the pre-ES6 "module pattern" (`var Foo = { bar:
  # function() {...}, baz: function() {...} }`), the dominant declaration
  # style in jQuery-era codebases with no class/module syntax at all, plus the
  # equivalent arrow-function-as-property-value shape (`{ onSuccess: () =>
  # {...} }`, e.g. an $.ajax callback config). Before this pattern, every
  # method in an object-literal module was invisible: no node, so
  # impact/context on the method name (a normal thing to search for — it's
  # the only name that appears at the call site) returned "not found", and
  # the file collapsed to one flat (module) node.
  - name: object_method_pair
    query: |
      (pair
        key: [(property_identifier) (string)] @name
        value: [(function_expression) (arrow_function)]) @_def
    captures:
      - name: name
        role: func_name

  # { test: /^dep:/i, parse: parseDepPrefix } — a dispatch-table entry
  # referencing an already-declared function BY NAME as a property value,
  # not defining one inline (object_method_pair's shape). The function is
  # only ever reached by reading this property and calling it indirectly
  # (`entry.parse(x)`), never a literal call site naming it — the same
  # "invoked as a value" shape Go's SSA referencedIDs already captures.
  # isCallRef routes this to matcher.go's Pass 3c (see MetaReferencedAsValue)
  # instead of node creation: it names an existing node, not a new one.
  - name: object_value_ref
    query: |
      (pair value: (identifier) @ref)
    captures:
      - name: ref
        role: func_ref

  # foo() {} — ES6 method shorthand. tree-sitter uses the same
  # method_definition node whether this sits in an object literal
  # (`{ foo() {} }`) or a class body (`class X { foo() {} }`), so one pattern
  # covers both; getters/setters/constructor are method_definition too and are
  # real symbols worth a node same as any other method.
  - name: object_method_shorthand
    query: |
      (method_definition
        name: (property_identifier) @name) @_def
    captures:
      - name: name
        role: func_name
