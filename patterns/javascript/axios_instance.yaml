language: javascript
version: "1"
package: axios
# X.1a: axios_instance_call's url capture is loosened from (string) to (_) so
# a dynamic call through a known instance (store.get(`${x}/y`)) is captured
# instead of silently producing no node at all — EnrichAliases (alias.go:
# 160-164) does not drop an unresolved via_alias receiver, it keeps the node
# as an http_client, so there is no "known-instance" gate elsewhere. The
# package: axios gate above is the compensating precision guard (mirrors
# pusher-js/bunny): without it, any `.get(...)` call through any object would
# match once X.1b's template reconstruction makes such calls resolvable.
patterns:
  - name: axios_create_with_baseurl
    query: |
      (variable_declarator
        name: (identifier) @instance_name
        value: (call_expression
          function: (member_expression
            object: (identifier) @obj
            (#eq? @obj "axios")
            property: (property_identifier) @fn
            (#eq? @fn "create"))
          arguments: (arguments
            (object
              (pair
                key: (property_identifier) @key
                (#eq? @key "baseURL")
                value: (_) @instance_base_url)))))
    captures:
      - name: instance_name
        role: alias_instance_name
      - name: instance_base_url
        role: alias_base_url
  - name: axios_instance_call
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @via_alias
          property: (property_identifier) @method
          (#match? @method "^(get|post|put|patch|delete|head|options|request)$"))
        arguments: (arguments
          .
          (_) @url))
    captures:
      - name: via_alias
        role: alias_receiver
      - name: method
        role: http_method
      - name: url
        role: http_url
