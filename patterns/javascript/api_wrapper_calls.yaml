language: javascript
version: "1"
patterns:
  # apiGet(url, ...) / apiPut(url, ...) / apiPost(url, ...) / ... — a call
  # through a shared axios wrapper (this codebase's services/ApiServices.js:
  # `export const apiPut = (url, data, params) => axios({ method: "PUT",
  # url, ... })`). The bare call site (`apiPut(updateUrl, ...)`) matched
  # neither axios_instance_call (receiver must be a known instance alias,
  # not a bare function name) nor producer_alias_url_call (its URL argument
  # must be a string/template literal, not a variable) — every wrapped React
  # API call in a codebase using this convention was invisible: no
  # http_client node, so impact/context on the containing component never
  # reached the backend at all.
  #
  # Gated on the wrapper's own name rather than "any bare-identifier call"
  # (which is exactly the noise class dropNonHTTPJSMatches exists to filter
  # — see js_axios_receiver.go) so this cannot misfire on an unrelated
  # same-shaped call the way axios_instance_call's unqualified match did.
  # The URL capture stays loose ((_) rather than a string) since the whole
  # point is to catch the common case where it's a local variable; the
  # resulting node's URL is that variable's name text, not a resolved path —
  # a real node with an unresolved target, not a guessed one.
  - name: js_api_wrapper_call
    query: |
      (call_expression
        function: (identifier) @method
        (#match? @method "^(apiGet|apiPut|apiPost|apiPatch|apiDelete|apiAny)$")
        arguments: (arguments . (_) @url . _*))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
