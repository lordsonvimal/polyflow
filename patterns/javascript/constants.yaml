language: javascript
version: "1"
patterns:
  - name: const_string
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @name
          value: (string) @value))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  - name: const_template_prefix
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @name
          value: (template_string) @value))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  # URL-builder helpers: a function whose body returns a string/template
  # literal (e.g. mermaidURL() → `/api/export/mermaid?${sp}`). Feeds the
  # constant-propagation table so fetch(mermaidURL(...)) resolves to a path.
  - name: fn_return_string
    query: |
      (function_declaration
        name: (identifier) @name
        body: (statement_block
          (return_statement
            (string) @value)))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  - name: fn_return_template_prefix
    query: |
      (function_declaration
        name: (identifier) @name
        body: (statement_block
          (return_statement
            (template_string) @value)))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  - name: fn_return_string
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @name
          value: (arrow_function
            body: (string) @value)))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  - name: fn_return_template_prefix
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @name
          value: (arrow_function
            body: (template_string) @value)))
    captures:
      - name: name
        role: const_name
      - name: value
        role: const_value
  # H.2: object-literal constant members — export const clientRoutes = {
  # home: "/", settings: "/settings" }. Feeds "objName.propKey" entries into
  # the constant table so the JS KeyWalker's member_expression case can
  # resolve `clientRoutes.home` (Solid Router's real-world route-path shape)
  # to its literal value instead of ledgering it as key_dynamic.
  - name: const_object_member
    query: |
      (lexical_declaration
        (variable_declarator
          name: (identifier) @obj
          value: (object
            (pair
              key: (property_identifier) @key
              value: (string) @value))))
    captures:
      - name: obj
        role: const_name
      - name: key
        role: const_key
      - name: value
        role: const_value
