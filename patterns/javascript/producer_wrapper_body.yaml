  # Positional-forward (WB.4) and axios(config-object) forward patterns moved
  # to producer_wrapper_positional.yaml: unlike the member/destructure
  # patterns above, none of them reference formal_parameters' shape in their
  # query text (they only match the call site inside the wrapper's body;
  # matcher.go's execQueries walks the parameter list directly in Go, not via
  # a grammar-specific query), so they don't need this file's
  # javascript-only grammar restriction — and DID need to not have it, so
  # they can also run against the typescript grammar DetectJSGrammar falls
  # back to for a Flow-typed .js file.
