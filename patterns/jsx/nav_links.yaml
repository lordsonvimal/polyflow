language: jsx
version: "1"
patterns:
  # Forms with an explicit method: <form action="/save" method="post">.
  # Two entries cover both attribute orders; listed before the generic
  # pattern so the method-aware node wins the http_client dedup.
  - name: nav_link_form
    query: |
      (jsx_opening_element
        (jsx_attribute
          (property_identifier) @prop
          (#eq? @prop "action")
          (string
            (string_fragment) @path_frag
            (#match? @path_frag "^/")) @path)
        (jsx_attribute
          (property_identifier) @mprop
          (#eq? @mprop "method")
          (string
            (string_fragment) @method)))
    captures:
      - name: path
        role: http_path
      - name: method
        role: http_method
  - name: nav_link_form
    query: |
      (jsx_opening_element
        (jsx_attribute
          (property_identifier) @mprop
          (#eq? @mprop "method")
          (string
            (string_fragment) @method))
        (jsx_attribute
          (property_identifier) @prop
          (#eq? @prop "action")
          (string
            (string_fragment) @path_frag
            (#match? @path_frag "^/")) @path))
    captures:
      - name: path
        role: http_path
      - name: method
        role: http_method
  # Navigation links in JSX: <a href="/reports">, <form action="/save">.
  # Only root-relative paths — external URLs and fragments are not part of
  # the app's own flow. The linker emits navigates_to edges to the matching
  # route handler (nav_link meta keeps them out of the API-call linking).
  - name: nav_link_jsx
    query: |
      (jsx_attribute
        (property_identifier) @prop
        (#match? @prop "^(href|action)$")
        (string
          (string_fragment) @path_frag
          (#match? @path_frag "^/")) @path)
    captures:
      - name: prop
        role: nav_attr
      - name: path
        role: http_path

  # X.1a: any braced href/action expression — <a href={cond ? "/admin" :
  # "/dashboard"}>, <a href={someVar}>, <a href={`/rooms/${id}`}>, etc.
  # Captures the bare expression node as @path (the same convention every
  # other producer key uses) and lets contract.KeyWalkerFor("javascript")
  # classify it: a ternary of literals fans out via key_candidates, a
  # template/concat with holes reconstructs to a wildcarded template (X.1b),
  # and anything else surfaces as key_dynamic. Replaces the former
  # nav_link_jsx_ternary/nav_link_jsx_dynamic pair (G.6's JSX-only
  # @branch_N/@key_expr convention), unifying nav links with the general
  # producer-key mechanism instead of a JSX-specific one.
  - name: nav_link_jsx_expr
    query: |
      (jsx_attribute
        (property_identifier) @prop
        (#match? @prop "^(href|action)$")
        (jsx_expression
          (_) @path))
    captures:
      - name: prop
        role: nav_attr
      - name: path
        role: http_path
