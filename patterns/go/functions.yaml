language: go
version: "1"

# No package gate: these are the Go language's own reserved interface method
# names (fmt.Stringer, the error interface, encoding/json's Marshaler/
# Unmarshaler, encoding.TextMarshaler/TextUnmarshaler, database/sql's
# Scanner/Valuer, net/http's Handler), so they apply to every Go service
# regardless of its dependencies. A method with one of these exact names and
# signature is invoked by the stdlib through an interface value, never a
# literal call site — so it is a zero-caller false positive in the deadcode
# scan by construction, the same way an HTTP handler is.
reflect_dispatched_methods:
  - String
  - Error
  - MarshalJSON
  - UnmarshalJSON
  - MarshalText
  - UnmarshalText
  - Scan
  - Value
  - ServeHTTP

patterns:
  # @_def spans the whole declaration so the matcher can record where the
  # body ends (containment-based enclosing-function attribution).
  - name: func_decl
    query: |
      (function_declaration
        name: (identifier) @name) @_def
    captures:
      - name: name
        role: func_name
  # The receiver type is captured so the containment linker can draw the
  # struct→method `contains` edge (pointer and value receivers both resolve to
  # the bare type identifier).
  - name: method_decl
    query: |
      (method_declaration
        receiver: (parameter_list
          (parameter_declaration
            type: [
              (type_identifier) @receiver
              (pointer_type (type_identifier) @receiver)
            ]))
        name: (field_identifier) @name) @_def
    captures:
      - name: name
        role: method_name
      - name: receiver
        role: receiver_type
