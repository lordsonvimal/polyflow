language: go
version: "1"
patterns:
  - name: http_get
    query: |
      (call_expression
        function: (selector_expression
          operand: (identifier) @pkg
          field: (field_identifier) @fn
          (#eq? @fn "Get"))
        arguments: (argument_list
          (_) @url))
    captures:
      - name: url
        role: http_url
  - name: http_post
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#eq? @fn "Post"))
        arguments: (argument_list
          .
          (_) @url
          .
          (_) @content_type
          .
          (_) @body))
    captures:
      - name: url
        role: http_url
  - name: http_new_request
    # Scoped to net/http's package identifier: httptest.NewRequest has the same
    # (method, target, body) shape but builds an inbound *server-side* request
    # for a handler test — it makes no outbound call, so classifying it as an
    # http_client mints a bogus endpoint whose label is a URL string literal.
    query: |
      (call_expression
        function: (selector_expression
          operand: (identifier) @pkg
          (#eq? @pkg "http")
          field: (field_identifier) @fn
          (#eq? @fn "NewRequest"))
        arguments: (argument_list
          .
          (_) @method
          .
          (_) @url
          .
          (_) @body))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
