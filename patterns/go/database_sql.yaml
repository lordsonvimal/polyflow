# Raw database/sql call sites: sql.Open + query/exec with SQL string
# literals. Ungated (stdlib). The method names (Query/QueryRow/Exec/…) are
# shared by unrelated APIs — e.g. a web framework's request-param getter
# `c.Query("q")` or `u.Query()` — so a bare string-literal first argument is
# NOT a sufficient guard: `"q"` is a string literal too. Every query/exec
# pattern additionally requires the literal to begin with a SQL statement
# keyword (#match? @sql), which is what actually distinguishes a real SQL
# call site from a look-alike method with a short string argument.
language: go
version: "1"
patterns:
  # sql.Open("postgres", dsn) — the driver name identifies the engine
  # (lib/pq → "postgres", modernc/mattn → "sqlite"/"sqlite3").
  - name: sql_open
    query: |
      (call_expression
        function: (selector_expression
          operand: (identifier) @pkg
          (#eq? @pkg "sql")
          field: (field_identifier) @fn
          (#eq? @fn "Open"))
        arguments: (argument_list
          .
          (interpreted_string_literal) @driver
          .
          (_) @dsn))
    captures:
      - name: driver
        role: datastore_driver

  # db.Query("SELECT …", args) / QueryRow — SQL string first
  - name: sql_query
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#match? @fn "^(Query|QueryRow)$"))
        arguments: (argument_list
          .
          [(interpreted_string_literal) (raw_string_literal)] @sql
          (#match? @sql "(?i)^[\"`][[:space:](]*(SELECT|INSERT|UPDATE|DELETE|REPLACE|MERGE|UPSERT|WITH|CALL|EXPLAIN|ANALYZE|PRAGMA|CREATE|ALTER|DROP|TRUNCATE|COMMENT|GRANT|REVOKE|SET|SHOW|VALUES|BEGIN|START|COMMIT|ROLLBACK|SAVEPOINT|LOCK|UNLOCK|COPY|LOAD|DECLARE|FETCH|LISTEN|NOTIFY|VACUUM|REINDEX|REFRESH)[^A-Za-z]")))
    captures:
      - name: fn
        role: sql_op
      - name: sql
        role: sql_text

  # db.QueryContext(ctx, "SELECT …") / QueryRowContext — ctx first, SQL second
  - name: sql_query
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#match? @fn "^(QueryContext|QueryRowContext)$"))
        arguments: (argument_list
          .
          (identifier) @ctx
          .
          [(interpreted_string_literal) (raw_string_literal)] @sql
          (#match? @sql "(?i)^[\"`][[:space:](]*(SELECT|INSERT|UPDATE|DELETE|REPLACE|MERGE|UPSERT|WITH|CALL|EXPLAIN|ANALYZE|PRAGMA|CREATE|ALTER|DROP|TRUNCATE|COMMENT|GRANT|REVOKE|SET|SHOW|VALUES|BEGIN|START|COMMIT|ROLLBACK|SAVEPOINT|LOCK|UNLOCK|COPY|LOAD|DECLARE|FETCH|LISTEN|NOTIFY|VACUUM|REINDEX|REFRESH)[^A-Za-z]")))
    captures:
      - name: fn
        role: sql_op
      - name: sql
        role: sql_text

  # db.Exec("INSERT …", args)
  - name: sql_exec
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#eq? @fn "Exec"))
        arguments: (argument_list
          .
          [(interpreted_string_literal) (raw_string_literal)] @sql
          (#match? @sql "(?i)^[\"`][[:space:](]*(SELECT|INSERT|UPDATE|DELETE|REPLACE|MERGE|UPSERT|WITH|CALL|EXPLAIN|ANALYZE|PRAGMA|CREATE|ALTER|DROP|TRUNCATE|COMMENT|GRANT|REVOKE|SET|SHOW|VALUES|BEGIN|START|COMMIT|ROLLBACK|SAVEPOINT|LOCK|UNLOCK|COPY|LOAD|DECLARE|FETCH|LISTEN|NOTIFY|VACUUM|REINDEX|REFRESH)[^A-Za-z]")))
    captures:
      - name: fn
        role: sql_op
      - name: sql
        role: sql_text

  # db.ExecContext(ctx, "INSERT …", args)
  - name: sql_exec
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#eq? @fn "ExecContext"))
        arguments: (argument_list
          .
          (identifier) @ctx
          .
          [(interpreted_string_literal) (raw_string_literal)] @sql
          (#match? @sql "(?i)^[\"`][[:space:](]*(SELECT|INSERT|UPDATE|DELETE|REPLACE|MERGE|UPSERT|WITH|CALL|EXPLAIN|ANALYZE|PRAGMA|CREATE|ALTER|DROP|TRUNCATE|COMMENT|GRANT|REVOKE|SET|SHOW|VALUES|BEGIN|START|COMMIT|ROLLBACK|SAVEPOINT|LOCK|UNLOCK|COPY|LOAD|DECLARE|FETCH|LISTEN|NOTIFY|VACUUM|REINDEX|REFRESH)[^A-Za-z]")))
    captures:
      - name: fn
        role: sql_op
      - name: sql
        role: sql_text
