# GORM ORM call shapes (svc-b, svc-c-mgr).
#
# Gate: only activates for services depending on gorm.io/gorm — the
# method-chain finishers (First/Find/Create/…) are generic method names that
# would misfire on unrelated code without the dependency gate. Shape-level
# guards additionally require the idiomatic &target pointer argument.
language: go
version: "1"
package: gorm.io/gorm

# TableName (the Tabler interface) and the model lifecycle hooks
# (Before*/After*) are never called by a literal call site in application
# code — GORM finds and invokes them via reflection when it operates on a
# model. Declaring them here (rather than hardcoding the name list in
# internal/deadcode) means the exclusion only applies to services that
# actually depend on gorm.io/gorm, and a future GORM hook can be added
# without touching Go source.
reflect_dispatched_methods:
  - TableName
  - BeforeCreate
  - AfterCreate
  - BeforeUpdate
  - AfterUpdate
  - BeforeSave
  - AfterSave
  - BeforeDelete
  - AfterDelete
  - AfterFind

patterns:
  # gorm.Open(postgres.Open(dsn), &gorm.Config{}) — captures the dialector so
  # the datastore engine (postgres/sqlite) is recorded.
  - name: gorm_open
    query: |
      (call_expression
        function: (selector_expression
          operand: (identifier) @pkg
          (#eq? @pkg "gorm")
          field: (field_identifier) @fn
          (#eq? @fn "Open"))
        arguments: (argument_list
          .
          (call_expression
            function: (selector_expression
              operand: (identifier) @dialector)) ))
    captures:
      - name: dialector
        role: datastore_engine

  # Query finishers: db.Where("…").First(&user), db.Find(&users), …
  - name: gorm_query
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#match? @fn "^(First|Find|Take|Last|Scan|Count|Pluck)$"))
        arguments: (argument_list
          .
          (unary_expression) @target))
    captures:
      - name: fn
        role: gorm_op
      - name: target
        role: query_target

  # Persistence, &pointer form: db.Create(&user), db.Save(&user),
  # db.Delete(&user), db.Updates(&user).
  - name: gorm_persist
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#match? @fn "^(Create|Save|Delete|Update|Updates|UpdateColumn|UpdateColumns)$"))
        arguments: (argument_list
          .
          (unary_expression) @target))
    captures:
      - name: fn
        role: gorm_op
      - name: target
        role: persist_target

  # Persistence, chain form: db.Model(&X{}).Where(...).Updates(cols) /
  # tx.Where(...).Delete(&x). Repository code overwhelmingly writes this way
  # and the finisher's argument is a plain column map, not a &pointer — so
  # gorm_persist above never fires. GORM-ness is proven here by the
  # immediately-preceding chain method (Where/Model/…), which no unrelated
  # `.Create` call has. No @target: LinkGormModelTables resolves the table
  # from the enclosing <Model>Repository / <Model>Service receiver (and from
  # the .Model(&X{}) type when the chain method is Model).
  - name: gorm_persist_chain
    query: |
      (call_expression
        function: (selector_expression
          operand: (call_expression
            function: (selector_expression
              field: (field_identifier) @chain
              (#match? @chain "^(Where|Model|Session|Table|Scopes|Not|Or|Joins|Preload|Select|Omit|Clauses|Unscoped|Order|Limit|Offset|Group|Having|Distinct|Begin)$")))
          field: (field_identifier) @fn
          (#match? @fn "^(Create|Save|Delete|Update|Updates|UpdateColumn|UpdateColumns)$")))
    captures:
      - name: chain
        role: gorm_chain
      - name: fn
        role: gorm_op

  # Explicit table selection: db.Table("audits").Find(&x) /
  # db.Table("maple_exec_configs").Where(...).Updates(...). The literal is an
  # exact table name — LinkGormModelTables consumes meta["table_name"]
  # directly, skipping model→table resolution. Name prefix "gorm_persist"
  # so classifyPattern classifies it NodeTypeDatastore + EdgeTypePersists
  # without a new case (op is a hint only; the query/persist distinction is
  # not knowable from .Table() alone).
  - name: gorm_persist_table
    query: |
      (call_expression
        function: (selector_expression
          field: (field_identifier) @fn
          (#eq? @fn "Table"))
        arguments: (argument_list
          .
          (interpreted_string_literal) @table_name))
    captures:
      - name: table_name
        role: table_name
