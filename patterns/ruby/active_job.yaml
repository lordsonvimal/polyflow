# ActiveJob shapes shared by delayed_job and solid_queue backends
# (MainSvc, alder, cedar — none use Sidekiq; job classes and perform_later are
# the common surface, the adapter is configuration).
language: ruby
version: "1"
package: activejob
patterns:
  # ReportJob.perform_later(user.id) — receiver may be a bare constant or a
  # namespaced scope resolution (Admin::ReportJob); both are captured raw
  # (X.2: matcher.go leaves the text as-is, quote_strip/normalized tiers in
  # the jobs.yaml contract rule handle the rest).
  - name: aj_perform_later
    query: |
      (call
        receiver: [(constant) (scope_resolution)] @job_class
        method: (identifier) @fn
        (#match? @fn "^(perform_later|perform_now)$"))
    captures:
      - name: job_class
        role: job_class
      - name: fn
        role: enqueue_kind

  # ReportJob.set(wait: 5.minutes).perform_later(id)
  - name: aj_perform_later
    query: |
      (call
        receiver: (call
          receiver: [(constant) (scope_resolution)] @job_class
          method: (identifier) @set
          (#eq? @set "set"))
        method: (identifier) @fn
        (#match? @fn "^(perform_later|perform_now)$"))
    captures:
      - name: job_class
        role: job_class

  # class ReportJob < ApplicationJob ... def perform(...) — superclass is
  # usually the bare ApplicationJob, but jobs can subclass ActiveJob::Base
  # directly (scope_resolution), so both shapes are captured raw and matched
  # against both the bare and namespaced spellings.
  - name: aj_perform_method
    query: |
      (class
        name: [(constant) (scope_resolution)] @job_class
        superclass: (superclass [(constant) (scope_resolution)] @super
          (#match? @super "^(ApplicationJob|ActiveJob(::Base)?)$"))
        body: (body_statement
          (method
            name: (identifier) @name
            (#eq? @name "perform"))))
    captures:
      - name: job_class
        role: job_class
      - name: name
        role: perform_method

  # CJ: the same shape with NO predicate on the superclass name. A project
  # that introduces its own base class (ReportJob < ProjectBaseJob <
  # ApplicationJob) fails the predicate above at depth 1, so ~half of a real
  # monolith's job classes mint no subscriber node at all. A tree-sitter
  # predicate cannot walk an inheritance chain; the linker can, so this
  # pattern only *nominates* the class and internal/linker/ruby_job_inherit.go
  # decides. It is deliberately classified as an inert bookkeeping node
  # (matcher.go's classifyPattern), never a subscriber: promotion to
  # subscriber happens only for a class that actually reaches an ActiveJob
  # root over `inherits` edges. Every candidate the linker does not promote is
  # deleted, so a PORO with a `perform` method adds nothing to the graph.
  #
  # The perform-name capture is deliberately NOT called `name`: matcher.go
  # labels a node from a `name` capture, which would put `perform` in this
  # node's label and make it indistinguishable from the Ruby parser's own
  # `perform` method node.
  - name: aj_perform_method_candidate
    query: |
      (class
        name: [(constant) (scope_resolution)] @job_class
        superclass: (superclass)
        body: (body_statement
          (method
            name: (identifier) @perform_name
            (#eq? @perform_name "perform"))))
    captures:
      - name: job_class
        role: job_class
      - name: perform_name
        role: perform_method
