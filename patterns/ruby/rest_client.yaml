language: ruby
version: "1"
patterns:
  # `RestClient.get(url)` / `RestClient::Resource.post(url, payload)` — the
  # verb is the method name and the URL is the first positional argument.
  # Restricted to real HTTP verbs so it does not also claim the keyword-arg
  # form below, whose first argument is a `pair`, not a URL.
  - name: rest_client_verb
    query: |
      (call
        receiver: (scope_resolution
          scope: (constant) @ns
          (#eq? @ns "RestClient")
          name: (constant) @cls)
        method: (identifier) @method
        (#match? @method "^(get|post|put|patch|delete|head|options)$")
        arguments: (argument_list
          (_) @url . _*))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
  # `RestClient::Request.execute(method: :get, url: url, ...)` — the keyword
  # form. Matching it positionally captured the `method: :get` pair as the URL
  # and the literal string "execute" as the verb, so every such call site
  # carried a fabricated method and an unresolvable URL.
  - name: rest_client_request
    query: |
      (call
        receiver: (scope_resolution
          scope: (constant) @ns
          (#eq? @ns "RestClient")
          name: (constant) @cls
          (#eq? @cls "Request"))
        method: (identifier) @fn
        (#match? @fn "^(execute|new)$")
        arguments: (argument_list
          (pair
            key: (hash_key_symbol) @_mkey
            (#eq? @_mkey "method")
            value: (_) @method)
          (pair
            key: (hash_key_symbol) @_ukey
            (#eq? @_ukey "url")
            value: (_) @url)))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
  # `Request.execute(method: method, url: url, ...)` — the same keyword form as
  # above, but called through an unqualified `Request` constant because the
  # enclosing class did `include RestClient` (orion-vega-agent's
  # NordicImportWatcher::Connection#execute). `Request` alone is a generic
  # constant, so the match is gated on RestClient::Request.execute's exact
  # signature: the leading `method:` and `url:` keyword pair. The positional
  # `Request.execute(foo, bar)` shape in the negative fixture must not match.
  - name: rest_client_request_included
    query: |
      (call
        receiver: (constant) @cls
        (#eq? @cls "Request")
        method: (identifier) @fn
        (#match? @fn "^(execute|new)$")
        arguments: (argument_list
          (pair
            key: (hash_key_symbol) @_mkey
            (#eq? @_mkey "method")
            value: (_) @method)
          (pair
            key: (hash_key_symbol) @_ukey
            (#eq? @_ukey "url")
            value: (_) @url)))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
  # `RestClient.get(url, headers)` / `RestClient.post(url, payload)` — the bare
  # constant receiver, as opposed to the `RestClient::Resource` scope_resolution
  # form above. These were previously matched only by httparty.yaml's un-gated
  # `Constant.verb(arg)` query; now that it is gated on the httparty gem they
  # need an owner here, or every real bare-RestClient call in a repo without
  # httparty would silently lose its node.
  - name: rest_client_bare_verb
    query: |
      (call
        receiver: (constant) @client
        (#eq? @client "RestClient")
        method: (identifier) @method
        (#match? @method "^(get|post|put|patch|delete|head|options)$")
        arguments: (argument_list
          (_) @url . _*))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
  - name: rest_client_resource
    query: |
      (call
        receiver: (constant) @client
        (#eq? @client "RestClient")
        method: (identifier) @fn
        (#eq? @fn "[]")
        arguments: (argument_list
          (_) @url))
    captures:
      - name: url
        role: http_url
  # `RestClient.send(method, url, opts)` — a dynamic-verb dispatch shape none
  # of the other patterns cover: `send` is not itself an HTTP verb, the real
  # verb is the first positional argument's *value* (often a variable), and
  # the URL is the second positional argument, not a keyword pair.
  - name: rest_client_send
    query: |
      (call
        receiver: (constant) @client
        (#eq? @client "RestClient")
        method: (identifier) @fn
        (#eq? @fn "send")
        arguments: (argument_list
          . (_) @method
          . (_) @url . _*))
    captures:
      - name: method
        role: http_method
      - name: url
        role: http_url
