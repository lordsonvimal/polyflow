# ActiveRecord::Observer lifecycle callback methods (Tier DC.25,
# docs/deadcode-false-positive-plan.md). A class extending
# `ActiveRecord::Observer` (the `rails-observers` gem — extracted from Rails
# core in 4.0, still in active use) and calling `observe :model_name` gets
# any of its lifecycle-named methods (`after_save`, `before_save`, ...)
# invoked by the framework for every matching event on the observed model —
# there is no literal call site anywhere in application code, the same
# "classificatory, not connective" shape as active_record_migration.yaml's
# change/up/down.
#
# Confirmed live (orion): `UserFileObserver#after_save`
# (app/observers/user_file_observer.rb, `class UserFileObserver <
# ActiveRecord::Observer` / `observe :user_file`) has zero inbound edges of
# any type — Gemfile.lock pins `rails-observers (0.1.5)` and
# `activerecord (8.1.3)`.
#
# The method list is read directly from rails-observers' own source
# (github.com/rails/rails-observers, lib/rails/observers/activerecord/
# observer.rb): `Observer#define_callbacks` iterates
# `ActiveRecord::Callbacks::CALLBACKS` and wires any name the observer
# subclass responds to. That constant (activerecord/lib/active_record/
# callbacks.rb, verified against the 6-1-stable branch and unchanged since —
# after_touch was the last addition, Rails 3.1) is copied below verbatim.
#
# Like db/migrate/'s change/up/down, these are ordinary English/Rails-
# callback-shaped names that exist unrelated to Observer classes throughout
# any Rails app (e.g. an ActiveRecord model's own `before_save :method`
# callback declarations resolve through LinkRailsFilters, not this file).
# reflect_dispatched_path_prefix scopes the exclusion to app/observers/, the
# Rails convention path every Observer subclass lives under, so it only
# fires on an actual Observer method, not a same-named method anywhere else
# in the service.
language: ruby
version: "1"
package: rails-observers
reflect_dispatched_path_prefix: app/observers/
reflect_dispatched_methods:
  - after_initialize
  - after_find
  - after_touch
  - before_validation
  - after_validation
  - before_save
  - around_save
  - after_save
  - before_create
  - around_create
  - after_create
  - before_update
  - around_update
  - after_update
  - before_destroy
  - around_destroy
  - after_destroy
  - after_commit
  - after_rollback
patterns: []
