language: ruby
version: "1"
patterns:
  # ── link_to / button_to ───────────────────────────────────────────────────
  # The destination is the second positional argument when there is link text
  # and the first when there is not. Both forms are written with and without
  # parentheses, and the two-argument queries below use `(_)` rather than a bare
  # `_` for that reason: an unnamed wildcard also matches the `(` token, so
  # `link_to("Create Org Admin", widget_path(id: 1))` matched with @path bound
  # to the link *text* — a node claiming a request to "Org Admin". The named
  # wildcard cannot bind a token, which leaves the parenthesised call to the
  # one-argument queries below, where the anchor pins the destination to the
  # first named argument.

  # link_to "Text", "/literal-path" or button_to "Text", "/literal-path"
  - name: nav_link_rails_literal
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          (_)
          (string) @path))
    captures:
      - name: path
        role: http_path

  # link_to "/literal-path" — one positional argument, which Rails uses as both
  # the destination and the link text. Anchored to the first named argument so
  # the two-argument form above cannot also match here.
  #
  # The leading `/` is doing two jobs. It keeps a bare `link_to "Home"` — link
  # text with no destination at all — unmatched, and it declines the very common
  # `link_to "#", data: { role: … } do`, whose `#` names no route and no
  # request: a nav producer for it is an orphan http_client describing a
  # navigation that never happens, the artifact the C.2 helper gate removed 28
  # of. The two-argument form still admits `link_to text, "#"`; that predates
  # this tier and moving it is a separate decision with its own counts.
  - name: nav_link_rails_literal
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          .
          (string) @path
          (#match? @path "^[\"']/")))
    captures:
      - name: path
        role: http_path

  # link_to "Text", helper_name (bare identifier — no call args)
  - name: nav_link_rails_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          (_)
          (identifier) @helper))
    captures:
      - name: helper
        role: rails_nav_helper

  # link_to "Text", helper_name(args) — helper called with arguments
  - name: nav_link_rails_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          (_)
          (call
            !receiver
            method: (identifier) @helper)))
    captures:
      - name: helper
        role: rails_nav_helper

  # link_to helper_name / link_to(helper_name(args), method: :delete) — the
  # destination is the only positional argument. The `_path`/`_url` suffix gate
  # (internal/parser/ruby_nav_helper_gate.go) drops the first-argument bindings
  # that are link text rather than a route helper, which is what makes an
  # anchored first-argument capture safe here.
  - name: nav_link_rails_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          .
          (identifier) @helper))
    captures:
      - name: helper
        role: rails_nav_helper

  - name: nav_link_rails_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^(link_to|button_to)$")
        arguments: (argument_list
          .
          (call
            !receiver
            method: (identifier) @helper)))
    captures:
      - name: helper
        role: rails_nav_helper

  # form_with url: "/literal-path" or form_for @obj, url: "/literal-path"
  - name: nav_link_rails_form_literal
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^form_(with|for)$")
        arguments: (_
          (pair
            key: (hash_key_symbol) @_key
            (#eq? @_key "url")
            value: (string) @path)))
    captures:
      - name: path
        role: http_path

  # form_with url: helper_name or form_with url: helper_name(args)
  - name: nav_link_rails_form_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^form_(with|for)$")
        arguments: (_
          (pair
            key: (hash_key_symbol) @_key
            (#eq? @_key "url")
            value: (identifier) @helper)))
    captures:
      - name: helper
        role: rails_nav_helper

  - name: nav_link_rails_form_helper
    query: |
      (call
        method: (identifier) @_fn
        (#match? @_fn "^form_(with|for)$")
        arguments: (_
          (pair
            key: (hash_key_symbol) @_key
            (#eq? @_key "url")
            value: (call
              !receiver
              method: (identifier) @helper))))
    captures:
      - name: helper
        role: rails_nav_helper

  # ── redirect_to: server-side navigation (C.3) ──────────────────────────────
  # A redirect is a page-to-page transition just like an anchor: the response
  # tells the browser which URL to request next, and it requests it with GET
  # against the same origin. So these are nav_link producers, not http_call
  # ones, and they answer "what page leads here" for the half of the flow a
  # view never spells out — after a successful create, where do you land.
  #
  # Only the first positional argument is targeted. `redirect_to x, notice: y`
  # keeps the flash value inside a `pair`, so a direct-child match on
  # argument_list cannot mistake it for the destination.

  # redirect_to "/literal-path"
  - name: nav_link_rails_redirect_literal
    query: |
      (call
        method: (identifier) @_fn
        (#eq? @_fn "redirect_to")
        arguments: (argument_list
          (string) @path))
    captures:
      - name: path
        role: http_path

  # redirect_to folder_path  (bare helper, no arguments)
  - name: nav_link_rails_redirect_helper
    query: |
      (call
        method: (identifier) @_fn
        (#eq? @_fn "redirect_to")
        arguments: (argument_list
          (identifier) @helper))
    captures:
      - name: helper
        role: rails_nav_helper

  # redirect_to folder_path(@folder)  (helper called with arguments)
  - name: nav_link_rails_redirect_helper
    query: |
      (call
        method: (identifier) @_fn
        (#eq? @_fn "redirect_to")
        arguments: (argument_list
          (call
            !receiver
            method: (identifier) @helper)))
    captures:
      - name: helper
        role: rails_nav_helper
