language: go
version: "1"
package: github.com/gofiber/fiber/v2
patterns:
  - name: fiber_route
    query: |
      (call_expression
        function: (selector_expression
          operand: (identifier) @router
          field: (field_identifier) @method
          (#match? @method "^(Get|Post|Put|Patch|Delete)$"))
        arguments: (argument_list
          (interpreted_string_literal) @path
          (_) @handler))
    captures:
      - name: method
        role: http_method
      - name: path
        role: http_path
      - name: handler
        role: handler_ref
