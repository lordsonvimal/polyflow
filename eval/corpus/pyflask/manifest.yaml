repo:
  name: pyflask
  # Hand-authored local fixture. Index with:
  #   cd eval/testdata/pyflask && polyflow index --full
  # This is a path-based (LocalOnly) repo; CI skips it without failing the gate.
  path: eval/testdata/pyflask
  sha: "local-fixture-v1"
  workspace: polyflow.yml

# Selection rationale: pyflask is a hand-crafted multi-service Python fixture
# that exercises every L.P0–L.P3 pattern class in a single coherent project:
#   api/     — FastAPI service with HTTP routes (L.P2) and Celery dispatch (L.P3)
#   worker/  — Celery task consumer service (L.P3)
#   gateway/ — Flask service with HTTP routes (L.P2)
#
# Verification method: every case was verified by reading the fixture source
# directly (eval/testdata/pyflask/). Node labels are function names captured
# by the @name capture in each pattern; cross-service impact comes from
# job_enqueue edges created by contracts/jobs.yaml Celery rules.
#
# Cases 1–5: Celery consumers — each task function in worker/tasks.py has an
# inbound job_enqueue edge from the dispatch call in api/main.py, so the impact
# of the consumer node includes both files.
# Cases 6–13: FastAPI HTTP handler nodes — SearchNodes finds them by function
# name; impact includes the definition file (no HTTP client cross-links in this
# fixture).
# Cases 14–16: Flask HTTP handler nodes — same rationale as FastAPI cases.
cases:
  # ── Celery task consumers (cross-service job_enqueue impact) ────────────────
  #
  # D.4: all five are `exhaustive`. This fixture is 152 lines across 5 files and
  # was read end to end to establish it: the only `.delay`/`.apply_async` call
  # sites in the whole tree are api/main.py:22,28,34,40,46, nothing imports
  # worker/tasks.py besides api/main.py, and no task calls another task. So
  # {worker/tasks.py, api/main.py} is the complete blast radius of any one of
  # them, not a sample — which is the only claim `exhaustive` makes.
  #
  # gateway/app.py is deliberately NOT forbidden on these cases even though it
  # is absent today. The gateway POSTs to /notify/{user_id}, whose handler
  # dispatches send_notification, so once the gateway→api HTTP link resolves
  # (it does not today: the only cross-service edges in this fixture are the
  # five job_enqueue ones) gateway/app.py becomes a CORRECT depth-3 member of
  # that closure. Forbidding it would point the gate at a recall fix.

  - id: celery-send-notification
    kind: node
    target: send_notification
    # @app.task def send_notification(...) in worker/tasks.py (line 8).
    # Dispatched via send_notification.delay(user_id, message) in api/main.py.
    # The job_enqueue edge links the Publisher (api/main.py) to the Subscriber
    # (worker/tasks.py), so impact of the consumer includes both files.
    exhaustive: true
    expected_impacted:
      - worker/tasks.py
      - api/main.py
    must_not_miss:
      - worker/tasks.py
    # The routers are included by api/main.py but never dispatch a task, so no
    # route module can reach a worker task. These are the nearest files a
    # containment fan-out through main.py would drag in.
    must_not_include:
      - api/routes/users.py
      - api/routes/orders.py

  - id: celery-process-payment
    kind: node
    target: process_payment
    # @app.task(bind=True) def process_payment(...) in worker/tasks.py (line 13).
    # Dispatched via process_payment.delay(order_id, amount) in api/main.py.
    exhaustive: true
    expected_impacted:
      - worker/tasks.py
      - api/main.py
    must_not_miss:
      - worker/tasks.py

  - id: celery-generate-invoice
    kind: node
    target: generate_invoice
    # @shared_task def generate_invoice(...) in worker/tasks.py (line 18).
    # Dispatched via generate_invoice.apply_async(args=[order_id]) in api/main.py.
    exhaustive: true
    expected_impacted:
      - worker/tasks.py
      - api/main.py
    must_not_miss:
      - worker/tasks.py
    # gateway/app.py IS forbidden here, unlike on send-notification: the
    # gateway's only two outbound calls are POST /notify/{user_id} and
    # GET /users/, neither of which reaches POST /invoices/{order_id}. So no
    # correct resolution of the gateway→api link can ever put it in this
    # closure, and its appearance would be precisely the "client of the service
    # lands in every one of that service's blast radii" fan-out phantom.
    must_not_include:
      - api/routes/orders.py
      - gateway/app.py

  - id: celery-send-verification-email
    kind: node
    target: send_verification_email
    # @shared_task(bind=True) def send_verification_email(...) in worker/tasks.py.
    # Dispatched via send_verification_email.delay(user_id, email) in api/main.py.
    exhaustive: true
    expected_impacted:
      - worker/tasks.py
      - api/main.py
    must_not_miss:
      - worker/tasks.py

  - id: celery-cleanup-expired-sessions
    kind: node
    target: cleanup_expired_sessions
    # @app.task def cleanup_expired_sessions() in worker/tasks.py (line 28).
    # Dispatched via cleanup_expired_sessions.delay() in api/main.py.
    exhaustive: true
    expected_impacted:
      - worker/tasks.py
      - api/main.py
    must_not_miss:
      - worker/tasks.py
    # POST /cleanup takes no arguments and is called by nobody; the gateway
    # cannot reach it. Same fan-out assertion as celery-generate-invoice.
    must_not_include:
      - gateway/app.py
      - api/routes/users.py

  # ── FastAPI HTTP handler nodes (L.P2 pattern detection) ────────────────────

  - id: fastapi-create-user
    kind: node
    target: create_user
    # @router.post("/") async def create_user(...) in api/routes/users.py (line 7).
    # No HTTP client cross-links in this fixture; impact = definition file.
    expected_impacted:
      - api/routes/users.py
    must_not_miss:
      - api/routes/users.py

  - id: fastapi-get-user
    kind: node
    target: get_user
    # @router.get("/{user_id}") async def get_user(...) in api/routes/users.py.
    expected_impacted:
      - api/routes/users.py
    must_not_miss:
      - api/routes/users.py

  - id: fastapi-update-user
    kind: node
    target: update_user
    # @router.put("/{user_id}") async def update_user(...) in api/routes/users.py.
    expected_impacted:
      - api/routes/users.py
    must_not_miss:
      - api/routes/users.py

  - id: fastapi-list-users
    kind: node
    target: list_users
    # @router.get("/") async def list_users() in api/routes/users.py.
    expected_impacted:
      - api/routes/users.py
    must_not_miss:
      - api/routes/users.py

  - id: fastapi-delete-user
    kind: node
    target: delete_user
    # @router.delete("/{user_id}") async def delete_user(...) in api/routes/users.py.
    expected_impacted:
      - api/routes/users.py
    must_not_miss:
      - api/routes/users.py

  - id: fastapi-create-order
    kind: node
    target: create_order
    # @router.post("/") async def create_order(...) in api/routes/orders.py.
    expected_impacted:
      - api/routes/orders.py
    must_not_miss:
      - api/routes/orders.py

  - id: fastapi-get-order
    kind: node
    target: get_order
    # @router.get("/{order_id}") async def get_order(...) in api/routes/orders.py.
    expected_impacted:
      - api/routes/orders.py
    must_not_miss:
      - api/routes/orders.py

  - id: fastapi-update-order
    kind: node
    target: update_order
    # @router.put("/{order_id}/status") async def update_order(...) in api/routes/orders.py.
    expected_impacted:
      - api/routes/orders.py
    must_not_miss:
      - api/routes/orders.py

  # ── Flask HTTP handler nodes (L.P2 pattern detection) ──────────────────────

  - id: flask-health-check
    kind: node
    target: health_check
    # @app.route("/health") def health_check() in gateway/app.py.
    expected_impacted:
      - gateway/app.py
    must_not_miss:
      - gateway/app.py

  - id: flask-process-webhook
    kind: node
    target: process_webhook
    # @app.route("/webhook", methods=["POST"]) def process_webhook() in gateway/app.py.
    expected_impacted:
      - gateway/app.py
    must_not_miss:
      - gateway/app.py

  - id: flask-status-page
    kind: node
    target: status_page
    # @app.route("/status") def status_page() in gateway/app.py.
    expected_impacted:
      - gateway/app.py
    must_not_miss:
      - gateway/app.py

  # ── Semantic search cases (S.4) ────────────────────────────────────────────
  # Verified by running FTS search against the indexed pyflask DB (60 entities).
  # Requires the pyflask fixture to be re-indexed with `polyflow index` after S.1
  # (adds entities_fts table). Entity labels are function names from nodes table.

  - id: nl-send-email-notification
    kind: semantic
    query: "send notification email task"
    section: nodes
    # Verified: FTS search for "send*" + "notification*" returns send_notification
    # at rank 2–3 (behind celery_task_decorator). worker/tasks.py:send_notification.
    expect_any_of:
      - send_notification
    must_not_miss:
      - send_notification

  - id: nl-payment-processing
    kind: semantic
    query: "payment processing worker task"
    section: nodes
    # Verified: FTS search for "process*" + "payment*" returns process_payment.
    # worker/tasks.py:process_payment.
    expect_any_of:
      - process_payment
    must_not_miss:
      - process_payment

  - id: nl-create-user-endpoint
    kind: semantic
    query: "create new user registration"
    section: nodes
    # Verified: FTS search for "create*" + "user*" returns create_user.
    # api/routes/users.py:create_user.
    expect_any_of:
      - create_user
    must_not_miss:
      - create_user

  - id: nl-health-check-status
    kind: semantic
    query: "health check gateway status endpoint"
    section: nodes
    # Verified: FTS search for "health*" + "check*" returns health_check.
    # gateway/app.py:health_check.
    expect_any_of:
      - health_check
    must_not_miss:
      - health_check

  - id: nl-generate-invoice
    kind: semantic
    query: "generate invoice order task"
    section: nodes
    # Verified: FTS search for "generate*" + "invoice*" returns generate_invoice.
    # worker/tasks.py:generate_invoice.
    expect_any_of:
      - generate_invoice
    must_not_miss:
      - generate_invoice

  # --- C.6 rank-1 identity -------------------------------------------------

  - id: rank1-generate-invoice
    kind: rank1
    query: "generate_invoice billing"
    section: nodes
    # worker/tasks.py:generate_invoice.
    #
    # RECORDED DEFECT, red at baseline, and a distinct cause from the others.
    # Measured 2026-08-09: ranks 1 and 2 are the pattern-derived
    # `celery_apply_async` and `celery_task_decorator` nodes (0.0320 / 0.0300)
    # and the function itself is rank 3 at 0.0290 — sharing worker/tasks.py:20
    # with the decorator node that outranks it. A synthetic node minted *at* a
    # declaration outranks the declaration it describes.
    expect_rank1: generate_invoice
