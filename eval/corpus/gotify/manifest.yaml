repo:
  name: gotify
  url: https://github.com/gotify/server
  sha: 9f7dc63defae71ab719c7c370fa3b9d90a3baf98
  workspace: polyflow.yml

# Selection rationale: gotify/server is a real-time notification server with a Go
# gin backend (supported framework) and a TypeScript/React frontend. It has a clear
# front+back split (server/ + ui/), two primary languages (Go + TypeScript), and
# uses the gin router (patterns/go/gin_routes.yaml) and axios HTTP client
# (patterns/javascript/axios.yaml). ~200 code files — fast to index.
#
# Verification method: every case was verified by reading the Go source files
# directly (github.com/gotify/server at SHA 9f7dc63):
#   router/router.go — gin route registrations referencing each handler
#   api/message.go, api/application.go, api/session.go, api/client.go,
#   api/user.go, api/health.go, api/plugin.go — handler definitions
#   app.go — calls router.Create(db, vInfo, conf)
#   ui/src/ — TypeScript stores and components
# Grep commands used: grep -n "GetMessages\|DeleteMessage\|..." router/router.go
cases:
  # ── Go backend cases ──────────────────────────────────────────────────────

  - id: router-create-callers
    kind: node
    target: Create
    # router.Create (router/router.go) is called exactly once: app.go line
    # `engine, closeable := router.Create(db, vInfo, conf)`.
    # Verified: grep -n "router.Create" ./**/*.go → only app.go.
    expected_impacted:
      - app.go
    must_not_miss:
      - app.go

  - id: get-messages-callers
    kind: node
    target: GetMessages
    # api.MessageAPI.GetMessages (api/message.go) is registered in router/router.go:
    # `message.GET("", messageHandler.GetMessages)`.
    # Verified: grep -n "GetMessages" router/router.go → line found.
    #
    # D.1: exhaustive, same six-file closure and the same verification as
    # delete-message-callers (the `GET /message` route replaces the DELETE one,
    # and api/message_test.go's Test_GetMessages* call the handler directly).
    exhaustive: true
    expected_impacted:
      - api/message.go
      - api/message_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    must_not_include:
      - api/user.go
      - auth/authentication.go

  - id: create-message-callers
    kind: node
    target: CreateMessage
    # api.MessageAPI.CreateMessage (api/message.go) is registered in router/router.go:
    # `g.Group("/").Use(...).POST("/message", messageHandler.CreateMessage)`.
    # Verified: grep -n "CreateMessage" router/router.go → line found.
    expected_impacted:
      - router/router.go
    must_not_miss:
      - router/router.go

  - id: delete-message-callers
    kind: node
    target: DeleteMessage
    # api.MessageAPI.DeleteMessage (api/message.go) registered in router/router.go:
    # `message.DELETE("/:id", messageHandler.DeleteMessage)`.
    # Verified: grep -n "DeleteMessage" router/router.go → line found.
    #
    # D.1: exhaustive. The depth-10 backward closure is these six files and
    # nothing else, each hand-checked 2026-08-09 against the impact output:
    #   api/message.go        the declaration itself
    #   api/message_test.go   Test_DeleteMessage{,_invalidID,_notExistingID,
    #                         _existingIDButNotOwner} call it directly
    #   router/router.go      `DELETE /message/:id` → the handler
    #   router/router_test.go calls router.Create, which registers that route
    #   app.go                serve → router.Create → the route
    #   app_test.go           TestRun → run → serve
    # Every one is a file a change to this handler can genuinely require
    # touching, so precision here is a real number rather than a sampling
    # artifact.
    exhaustive: true
    expected_impacted:
      - api/message.go
      - api/message_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    # Deleting a message cannot reach the user or client APIs, and nothing in
    # the auth middleware calls this handler. These are the neighbours a
    # fan-out phantom would most plausibly drag in.
    must_not_include:
      - api/user.go
      - api/client.go
      - auth/authentication.go

  - id: health-handler-callers
    kind: node
    target: Health
    # api.HealthAPI.Health (api/health.go) registered in router/router.go:
    # `g.Match([]string{"GET", "HEAD"}, "/health", healthHandler.Health)`.
    # Verified: grep -n "healthHandler.Health" router/router.go → line found.
    expected_impacted:
      - router/router.go
    must_not_miss:
      - router/router.go

  # D.4: the seven handler cases below are `exhaustive`. They all close over the
  # same six files for the same reason, established call-level in D.1 on
  # DeleteMessage/GetMessages and re-verified here per handler:
  #
  #   api/<x>.go        the declaration
  #   api/<x>_test.go   the suite that calls the handler directly (`s.a.<X>(...)`)
  #   router/router.go  the one registration site (grep -c → exactly 1 each)
  #   router/router_test.go  calls router.Create, which runs that registration
  #   app.go            serve() → router.Create (app.go:116)
  #   app_test.go       TestRun → run → serve
  #
  # Checked for extra callers with a full-repo grep per name. Every additional
  # file it turned up (database/*.go, plugin/manager.go, test/testdb/*,
  # api/session_test.go, api/oidc_test.go) calls a SAME-NAMED method on
  # GormDatabase — `db.GetUsers()`, `s.db.CreateUser(...)`,
  # `db.GetClientsByUser(...)` — not the API handler. None belongs in the
  # closure and none is returned.

  - id: get-applications-callers
    kind: node
    target: GetApplications
    # api.ApplicationAPI.GetApplications (api/application.go) registered:
    # `app.GET("", applicationHandler.GetApplications)`.
    # Verified: grep -n "GetApplications" router/router.go → line found.
    exhaustive: true
    expected_impacted:
      - api/application.go
      - api/application_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    # Listing applications cannot reach the message or user handlers, and the
    # auth middleware calls no handler. The database layer is reached the other
    # way round (the handler calls it), so it must not appear in a BACKWARD walk.
    must_not_include:
      - api/message.go
      - api/user.go
      - database/application.go

  - id: create-application-callers
    kind: node
    target: CreateApplication
    # api.ApplicationAPI.CreateApplication (api/application.go) registered:
    # `app.POST("", applicationHandler.CreateApplication)`.
    # Verified: grep -n "CreateApplication" router/router.go → line found.
    #
    # target_file pins this to the API handler: `CreateApplication` is also a
    # GormDatabase method (database/application.go:39), and ResolveTarget
    # separates same-named methods by neither service nor node type — both are
    # `method` in service `server`. It resolves to the API one today only
    # because that path sorts first, which is not something an exhaustive truth
    # set should rest on.
    target_file: api/application.go
    exhaustive: true
    expected_impacted:
      - api/application.go
      - api/application_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    must_not_include:
      - database/application.go
      - plugin/manager.go

  - id: login-callers
    kind: node
    target: Login
    service: server
    # api.SessionAPI.Login (api/session.go) registered in router/router.go:
    # `g.POST("/auth/local/login", sessionHandler.Login)`.
    # ui.Login (ui/src/Login.tsx) is a different exact-label match in service=ui.
    # service: server pins resolution to api/session.go:Login (B.3 qualifier).
    # Verified: grep -n "sessionHandler.Login" router/router.go → line found.
    expected_impacted:
      - router/router.go
    must_not_miss:
      - router/router.go

  - id: get-clients-callers
    kind: node
    target: GetClients
    # api.ClientAPI.GetClients (api/client.go) registered in router/router.go:
    # `client.GET("", clientHandler.GetClients)`.
    # Verified: grep -n "GetClients" router/router.go → line found.
    # api/session_test.go mentions GetClients only as `s.db.GetClientsByUser`.
    exhaustive: true
    expected_impacted:
      - api/client.go
      - api/client_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    must_not_include:
      - api/session_test.go
      - database/client.go

  - id: get-current-user-callers
    kind: node
    target: GetCurrentUser
    # api.UserAPI.GetCurrentUser (api/user.go) registered in router/router.go:
    # `clientAuth.GET("current/user", userHandler.GetCurrentUser)`.
    # Verified: grep -n "GetCurrentUser" router/router.go → line found.
    # Unambiguous: the only GetCurrentUser in the repo (no database twin).
    exhaustive: true
    expected_impacted:
      - api/user.go
      - api/user_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go

  - id: get-users-callers
    kind: node
    target: GetUsers
    # api.UserAPI.GetUsers (api/user.go) registered in router/router.go:
    # `authAdmin.GET("", userHandler.GetUsers)`.
    # Verified: grep -n "GetUsers" router/router.go → line found.
    # Pinned: GormDatabase.GetUsers (database/user.go:61) is the same label.
    target_file: api/user.go
    exhaustive: true
    expected_impacted:
      - api/user.go
      - api/user_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    # plugin/manager.go:90 calls `manager.db.GetUsers()` — the database method,
    # not this handler. It is the most likely wrong-receiver hit on this name.
    must_not_include:
      - plugin/manager.go
      - database/user.go

  - id: create-user-callers
    kind: node
    target: CreateUser
    # api.UserAPI.CreateUser (api/user.go) registered:
    # `g.Group("/user").Use(authentication.Optional).POST("", userHandler.CreateUser)`.
    # Verified: grep -n "CreateUser" router/router.go → line found.
    # Pinned: GormDatabase.CreateUser (database/user.go:90) is the same label,
    # and it is the one api/oidc_test.go and api/session_test.go call
    # (`s.db.CreateUser(&model.User{...})`) — hence those two are forbidden.
    target_file: api/user.go
    exhaustive: true
    expected_impacted:
      - api/user.go
      - api/user_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    must_not_include:
      - api/oidc_test.go
      - api/session_test.go
      - database/user.go

  - id: get-plugins-callers
    kind: node
    target: GetPlugins
    # api.PluginAPI.GetPlugins (api/plugin.go) registered:
    # `g.GET("/plugin", authentication.RequireClient, pluginHandler.GetPlugins)`.
    # Verified: grep -n "GetPlugins" router/router.go → line found.
    # Unambiguous: api/plugin.go, api/plugin_test.go and router/router.go are
    # the only three files in the repo that mention the name at all.
    exhaustive: true
    expected_impacted:
      - api/plugin.go
      - api/plugin_test.go
      - router/router.go
      - router/router_test.go
      - app.go
      - app_test.go
    must_not_miss:
      - router/router.go
    must_not_include:
      - plugin/manager.go

  # ── TypeScript frontend cases ─────────────────────────────────────────────

  - id: init-axios-callers
    kind: node
    target: initAxios
    # initAxios (ui/src/apiAuth.ts) sets up axios interceptors. It is called
    # from the app initialization (ui/src/index.tsx or the root store setup).
    # Verified: grep -n "initAxios" ui/src/ shows import and call in index.tsx.
    expected_impacted:
      - ui/src/index.tsx
    must_not_miss:
      - ui/src/index.tsx

  - id: use-stores-callers
    kind: node
    target: useStores
    # useStores (ui/src/stores.tsx) is a React context hook consumed by UI
    # components. At minimum imported by message and application component
    # directories. AppStore.ts does NOT call useStores (it's the plain class
    # useStores() returns an instance of, not a caller) — Applications.tsx is
    # the real application-directory caller.
    # Verified: grep -rn "useStores" ui/src/ → multiple component files;
    # grep "useStores" ui/src/application/AppStore.ts → no match.
    expected_impacted:
      - ui/src/message/Messages.tsx
      - ui/src/application/Applications.tsx
    must_not_miss:
      - ui/src/message/Messages.tsx
      - ui/src/application/Applications.tsx

  # --- C.6 rank-1 identity -------------------------------------------------

  - id: rank1-create-application
    kind: rank1
    query: "CreateApplication"
    section: nodes
    # api/application.go:92 (the HTTP handler) — measured 2026-08-09 as rank1
    # 0.0160 exact, with database/application.go's same-named method rank2 at an
    # identical 0.0160. Gap 0.0000 between two same-labelled declarations, so
    # the label assertion passes either way and no target_file pin is claimed:
    # nothing in the bare query prefers one over the other, and pinning would
    # assert a preference the ranker never expressed.
    expect_rank1: CreateApplication

  - id: rank1-create-application-descriptive
    kind: rank1
    query: "CreateApplication gin handler"
    section: nodes
    # The pair to the case above, and the point of including both: adding two
    # *correct* descriptive words demotes the answer.
    #
    # RECORDED DEFECT, red at baseline. Measured 2026-08-09: rank1 becomes the
    # unrelated `Handler` struct in error/handler.go (0.0160) and
    # CreateApplication falls to rank2 at 0.0130 — the generic word outscores
    # the identifier that names the thing.
    expect_rank1: CreateApplication

  - id: rank1-delete-message
    kind: rank1
    query: "DeleteMessage api handler"
    section: nodes
    # api/message.go:306. Measured 2026-08-09: rank1 0.0150 exact, rank2
    # error/handler.go's `Handler` 0.0150 exact — gap 0.0000. The same usurper
    # as the case above, one thousandth of a point away from winning.
    expect_rank1: DeleteMessage

  - id: rank1-create-password
    kind: rank1
    query: "CreatePassword bcrypt strength"
    section: nodes
    # auth/password/password.go:6. Measured 2026-08-09: rank1 0.0160 exact,
    # rank2 extraGoBuildFlags 0.0160 semantic — gap 0.0000.
    expect_rank1: CreatePassword

  - id: rank1-password-hashing-nl
    kind: rank1
    query: "user password hashing"
    section: nodes
    # auth/password/password.go:CreatePassword is the only bcrypt call site in
    # the repo, and this is how an agent that does not already know the name
    # would ask.
    #
    # RECORDED DEFECT, red at baseline. Measured 2026-08-09: rank1 is the `User`
    # model (0.0240), then three UI `password` form variables. A purely
    # descriptive query — no identifier to anchor on — returns nothing useful in
    # the top four.
    expect_rank1: CreatePassword
