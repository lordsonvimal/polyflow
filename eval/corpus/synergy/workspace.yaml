name: synergy
version: "1"
services:
    - name: calendar-ui
      path: ./apps/calendar-ui
      language: typescript
      frameworks:
        - solid
    - name: chess
      path: ./apps/chess
      language: go
    - name: core
      path: ./apps/core
      language: go
      frameworks:
        - gin
        - grpc
    - name: sis
      path: ./apps/sis
      language: go
      frameworks:
        - templ
        - gin
    - name: tether
      path: ./apps/tether
      language: typescript
      frameworks:
        - solid
        - express
    - name: website
      path: ./apps/website
      language: javascript
    - name: theme
      path: ./packages/theme
      language: javascript
links: []
index:
    exclude:
        - '**/node_modules/**'
        - '**/vendor/**'
        - '**/dist/**'
        - '**/testdata/**'
        - '**/*_test/**'
        - '**/tmp/**'
settings:
    snippet_lines: 0
    default_layout: ""
    default_depth: 0
    port: 0
