repo:
  name: synergy
  # Private repo: the author's monorepo (Nx-style, no Nx tooling) with Go +
  # TypeScript/Solid services. On the author machine the local clone lives at
  # ~/Projects/synergy; symlink it into place with
  #   ln -s ~/Projects/synergy eval/.cache/synergy   (gitignored)
  # then run `polyflow index --full` inside it before running eval.
  # make eval-corpus skips path-based repos (SkippedCorpus.LocalOnly in CI).
  path: eval/.cache/synergy
  sha: 8f1e97a9ee3b0ec57aeb0cb51b0a27a4850a0fdc
  workspace: workspace.yaml

# Selection rationale: synergy is the fleet-audit repo that drove plan-7
# (Tier H) — Express/ws/Solid Router were all found uncovered here. This
# corpus gives H.0-H.2's shipped patterns their first measured recall number.
#
# Verification method (E.2 rule: ground truth is human-verified, never
# generated by polyflow): every target/expected_impacted pair below was
# established by `grep`/`Read` of the pinned sha and cross-checked against
# `polyflow impact --target` output; case selection, not ground truth, used
# the tool's own output as a starting point (E.2 permits this — the harness
# generating a *candidate* is fine, the harness *asserting its own answer is
# correct* is the forbidden circularity; every case below was read at its
# source location before being kept).
#
# Two "must cover" categories from the phase table came back an honest zero
# and are NOT represented below — recorded here rather than faked (rule 9,
# "never let a case pass by luck" / never fabricate a case that doesn't
# exist in the real repo):
#   - express (0 of the requested 3): grep-verified (`app\.(get|post|...)\(`,
#     `router\.(get|post|...)\(`) — zero Express verb-route registrations
#     exist in synergy today. tether's only `express` usage is
#     `app.use(express.static(...))`, a static-asset mount that structurally
#     does not match `express_mount`'s `(string) @path` shape. Matches H.0's
#     own outcome note verbatim.
#   - cross-service (0 of the requested 2): the graph *does* carry 25
#     `http_call` edges from tether/website into
#     `apps/sis/shared/dashboard/routes.go:6`, but tracing the producer node
#     back to source (e.g. ConnectScreen.tsx:75) shows pattern
#     `producer_alias_url_call` with an EMPTY `url` field — `createSignal(...)`
#     calls are being misclassified as URL-call producers and joined to sis's
#     `r.GET("/", handleDashboard)` catch-all by an empty/wildcard key. This
#     is a real false-positive in the alias-producer pattern, not a genuine
#     cross-service link — using it as eval ground truth would enshrine a bug
#     as a passing case (the exact E.2 circular-truth failure mode). No other
#     cross-service edge exists: no `fetch`/`axios` call in tether/calendar-ui
#     resolves to a literal host, no `grpc.Dial`/`resty`/`http.NewRequest` call
#     exists between core and sis (grep-verified). Recorded as an open gap —
#     the `producer_alias_url_call` false positive is a candidate follow-up
#     for whoever next touches the alias-producer pattern; out of scope here
#     (H.4 is corpus-only, no matcher changes).
# The two missing categories' slots are filled with additional real,
# hand-verified gin routes and JS/TS import-chain cases (see below) so the
# corpus still totals 12 well-formed cases.
cases:
  # ── Solid Router (H.2): App.tsx:11-13, three <Route path={clientRoutes.X}
  # component={Y} /> elements, each with a real "renders" edge from the
  # route to the component. clientRoutes is imported from a different file
  # so path resolution honestly ledgers (key_dynamic) rather than guesses —
  # not exercised by these node-impact cases, which target the component.

  - id: solid-route-home
    kind: node
    target: Home
    service: calendar-ui
    node_type: function
    # def apps/calendar-ui/src/components/home/home.tsx:7; rendered by
    # <Route path={clientRoutes.home} component={Home} /> App.tsx:11.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/components/home/home.tsx
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx

  - id: solid-route-authcallback
    kind: node
    target: AuthCallback
    service: calendar-ui
    node_type: function
    # def apps/calendar-ui/src/components/auth/authCallback.tsx:3; rendered
    # by <Route path={clientRoutes.callback} component={AuthCallback} />
    # App.tsx:12.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/components/auth/authCallback.tsx
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx

  - id: solid-route-dashboard
    kind: node
    target: Dashboard
    service: calendar-ui
    node_type: function
    # def apps/calendar-ui/src/components/dashboard/dashboard.tsx:8;
    # rendered by <Route path={clientRoutes.dashboard} component={Dashboard} />
    # App.tsx:13.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/components/dashboard/dashboard.tsx
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/App.tsx

  # ── ws server-side WebSocket (H.1): tether's real architecture —
  # wss.on("connection", ...) at index.ts:104-131 wires message handling to
  # handleMessage and battery polling to getBattery, both called from inside
  # the connection handler at index.ts:109 (message) / index.ts:114
  # (sendBattery, itself calling getBattery).

  - id: ws-connection-handle-message
    kind: node
    target: handleMessage
    service: tether
    node_type: function
    # def apps/tether/server/src/handler.ts:93; called from inside
    # wss.on("connection", ...) 's ws.on("message", ...) handler,
    # index.ts:109.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/handler.ts
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts

  - id: ws-connection-get-battery
    kind: node
    target: getBattery
    service: tether
    node_type: function
    # def apps/tether/server/src/battery.ts:8; called from sendBattery()
    # inside wss.on("connection", ...), index.ts:109-112.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/battery.ts
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts

  # ── Go gin routes (core + sis): route-group registration -> handler,
  # the X.1a route-handler linker, exercised on two services (5 cases,
  # 3 filling the express slot the repo cannot honestly supply — see above).

  - id: gin-core-get-user-by-id
    kind: node
    target: GetUserByID
    service: core
    node_type: function
    # def apps/core/handlers/user_handlers.go:11; registered
    # apps/core/routes/user_routes.go:13 (userGroup.GET("/:id", ...)).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/core/handlers/user_handlers.go
      - /Users/lordson/Projects/synergy/apps/core/routes/user_routes.go
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/core/routes/user_routes.go

  - id: gin-core-auth-redirect
    kind: node
    target: AuthRedirectHandler
    service: core
    node_type: function
    # def apps/core/handlers/auth_handlers.go:16; registered
    # apps/core/routes/auth_routes.go:19 (authGroup.GET("/redirect", ...)).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/core/handlers/auth_handlers.go
      - /Users/lordson/Projects/synergy/apps/core/routes/auth_routes.go
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/core/routes/auth_routes.go

  - id: gin-sis-get-course
    kind: node
    target: handleGetCourse
    service: sis
    node_type: function
    # def apps/sis/modules/academics/course/handler.go:17; registered
    # apps/sis/modules/academics/course/routes.go:10
    # (courseGroup.GET("/:id", ...)).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/sis/modules/academics/course/handler.go
      - /Users/lordson/Projects/synergy/apps/sis/modules/academics/course/routes.go
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/sis/modules/academics/course/routes.go

  - id: gin-sis-get-user
    kind: node
    target: handleGetUser
    service: sis
    node_type: function
    # def apps/sis/modules/administration/identity/handler.go:95; registered
    # apps/sis/modules/administration/identity/routes.go:11
    # (identityGroup.GET("/:id", ...)).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/sis/modules/administration/identity/handler.go
      - /Users/lordson/Projects/synergy/apps/sis/modules/administration/identity/routes.go
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/sis/modules/administration/identity/routes.go

  - id: gin-sis-get-fees
    kind: node
    target: handleGetFees
    service: sis
    node_type: function
    # def apps/sis/modules/finance/payment/handler.go:6; registered
    # apps/sis/modules/finance/payment/routes.go:7 (paymentGroup.GET("/", ...));
    # handler also navigates_to the shared templ layout (layout.templ),
    # exercising the templ nav-link pattern alongside the gin route link.
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/sis/modules/finance/payment/handler.go
      - /Users/lordson/Projects/synergy/apps/sis/modules/finance/payment/routes.go
      - /Users/lordson/Projects/synergy/apps/sis/modules/shared/ui/layouts/layout.templ
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/sis/modules/finance/payment/routes.go

  # ── JS/TS ESM import chains (Tier I.3), the two remaining slots covering
  # the express/cross-service gap recorded above with real, verified links.

  - id: calendar-ui-httpservice-imports
    kind: file
    target: apps/calendar-ui/src/services/httpService.ts
    # Imported by stores/authStore.ts and stores/userStore.ts
    # (grep-verified: both `import ... from "../services/httpService"`).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/stores/authStore.ts
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/stores/userStore.ts
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/calendar-ui/src/stores/authStore.ts

  - id: tether-terminal-imports
    kind: file
    target: apps/tether/server/src/terminal.ts
    # Imported by handler.ts (TerminalManager type) and index.ts
    # (`import { TerminalManager } from "./terminal.js"`).
    expected_impacted:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/handler.ts
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts
    must_not_miss:
      - /Users/lordson/Projects/synergy/apps/tether/server/src/index.ts
