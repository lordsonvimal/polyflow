# contracts/http.yaml — ports Linker.Link (API calls + nav-links).
version: "1"
contracts:
  # Variant 1: API calls (fetch/axios/datastar actions → handlers).
  - kind: http
    producer:
      node: http_client
      where: { nav_link: "" }        # meta gate: absent-or-empty ⇒ not a nav link
      key: [method, path]            # Meta fields, joined "METHOD path"
      key_fallbacks:
        path: [url]                  # Meta["path"] empty → derive from Meta["url"]
                                     # (url_to_path normalizer does the reduction)
      method_fallback: [GET, POST, PUT, PATCH, DELETE, ""]  # empty client method:
                                     # try verbs in this order (candidateMethods parity)
      target_service_meta: target_service  # when set on the node (by ApplyHints),
                                     # only consumers of that service are candidates
    consumer:
      node: http_handler
      key: [method, path]
    normalizers:                     # applied in order to each key field
      [case_fold, url_to_path, dynamic_host_strip, base_url_strip, query_strip, param_wildcard, trim_slash, empty_path_guard]
                                     # case_fold first: chi emits "Post", templ emits
                                     # "POST" — normalizing to lowercase before key
                                     # comparison gives method-case-insensitive parity
                                     # with Linker.Link's strings.ToUpper() call.
                                     # dynamic_host_strip (X.1b): drops the leading "*"
                                     # host/base segment a template-reconstructed URL
                                     # carries (fmt.Sprintf("%s/api/v1/x", base, ...)
                                     # → "*/api/v1/x") so it aligns with the handler's
                                     # bare "/api/v1/x" — placed after url_to_path,
                                     # before base_url_strip per the worked example.
                                     # empty_path_guard (J.2c) LAST: a path that has
                                     # reduced to nothing ("", "/", all-wildcard) is
                                     # voided, so an unresolvable client URL falls to
                                     # `unmatched` instead of exact-matching every
                                     # service's `GET /` handler (120 of 152 junk
                                     # cross-service http_call edges on the
                                     # juniper fleet came through that hole).
    match: [exact, normalized, wildcard_anchored]  # tiers in order; first hit wins
    edge:
      type: http_call
      id_prefix: link                # edge IDs stay "link:<from>-><to>" (parity!)
      same_service: keep               # skip | keep | skip_unless_meta:<key>
                                       # keep: a UI→own-API fetch IS a real internal
                                       # edge (recall-first). The old
                                       # skip_unless_meta:datastar let only datastar
                                       # producers self-match; every plain fetch/xhr
                                       # to the service's own handler then fell to the
                                       # service-less `unresolved` node and mis-scored
                                       # as a cross miss (measured on the svc-c
                                       # fleet: 44 fetch + 15 datastar svc-c-mgr→
                                       # svc-c-mgr calls; keep lifted cross_yield_static
                                       # 0.193→0.348 by moving them internal-resolved).
      via_meta: { datastar: datastar_action }   # producer meta key → edge Meta["via"]
    unmatched: unknown_edge          # visible edge to synthetic unresolved:<svc> node

  # Variant 2: navigation links (href/action) — same channel, different semantics.
  - kind: http
    producer:
      node: http_client
      where: { nav_link: "true" }
      key: [method, path]
      key_fallbacks: { path: [url] }
      target_service_meta: target_service  # shared lookup path in Linker.Link
      same_origin_relative: true   # J.2c: a relative link with no path segment
                                   # (`href="/"`) stays in its own service. Every
                                   # service has a root route, so matching them
                                   # all is information-free fan-out — all 19
                                   # cross-service navigates_to edges on the
                                   # juniper fleet were `/` → `GET /`. A
                                   # relative link that names a path, and any
                                   # absolute href, still crosses services.
    consumer:
      node: http_handler
      key: [method, path]
    normalizers: [case_fold, url_to_path, dynamic_host_strip, query_strip, param_wildcard, trim_slash, empty_path_guard]
    match: [exact, normalized, wildcard_anchored]
    edge:
      type: navigates_to
      id_prefix: nav                 # "nav:<from>-><to>"
      same_service: keep             # a page linking its own routes is the common case
      via_meta: { nav_link: nav_link }
    unmatched: drop                  # an unmatched LITERAL page link is not an app
                                     # flow (external URL/typo). Dynamic nav keys are
                                     # never dropped — they reach the ledger (G.6)
