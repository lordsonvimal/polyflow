# contracts/amqp.yaml — ports LinkBrokerChannels.
# Matches channel nodes (synthesised by the pattern matcher's Pass 4 for every
# AMQP publisher with exchange+routing_key meta) across services with the same
# channel key. Cross-service only; same-service channel loops are skipped.
version: "1"
contracts:
  - kind: amqp
    producer:
      node: channel
      # A channel node reached only through a QueueBind is the consuming side
      # and can never be the producer of a publishes edge. Both endpoints of
      # this rule are `channel`, so without this the join is symmetric and
      # emits an edge in each direction for every shared exchange — half of
      # them running backwards along the message flow. Measured on the
      # juniper fleet 2026-08-09: 8 of 30 cross-service publishes edges,
      # e.g. "maple-manager publishes runner_heartbeat to maple-agent" when the
      # agent publishes the heartbeats and the manager binds the queue.
      #
      # Exact-value exclusion, so a service that both publishes and binds
      # (channel_role "producer,consumer") stays eligible as a producer; only
      # pure consumers are dropped. A channel with no channel_role at all is
      # unclassified, not consumer, and is still admitted.
      #
      # Same fix, same reason as the queue contract's kicks_from_queue
      # exclusion below.
      not_where: {channel_role: consumer}
      key: [exchange, routing_key]
    consumer:
      node: channel
      key: [exchange, routing_key]
    normalizers: [quote_strip, dynamic_host_strip, amqp_topic_wildcard]
                                     # dynamic_host_strip is a no-op here
                                     # (exchange/routing_key never carry a
                                     # leading "*" host segment); added for
                                     # chain consistency (X.1b).
                                     # amqp_topic_wildcard (J.1) collapses topic
                                     # wildcards so a producer's reconstructed
                                     # "container.*" meets a binding's
                                     # "container.#".
    match: [exact, normalized, exchange_only]
                                     # exchange_only is last and stamps
                                     # `partial`: it fires only when one side's
                                     # routing key carries no information.
    edge:
      type: publishes
      id_prefix: broker
      same_service: skip
      via_meta:
        exchange: amqp_channel   # non-empty exchange → Meta["via"]="amqp_channel"
    unmatched: drop               # no meaningful ledger entry for unlinked channels
  # Queue-based AMQP flows (bunny channel.queue(name) publisher declare <->
  # kicks/Sneakers from_queue consumer). These carry queue_name, not
  # exchange/routing_key, so they are matched under a separate contract keyed
  # on queue_name. The two contracts are disjoint: an exchange channel has an
  # empty queue_name (skipped by keyIsEmpty) under this contract and vice
  # versa, so neither can produce an empty-key false match.
  - kind: amqp
    producer:
      node: channel
      # A Sneakers/kicks `from_queue` binding is unambiguously the consuming
      # side, so it can never be the producer of a publishes edge. The rest of
      # the rule stays symmetric because a bunny `channel.queue(name)` really is
      # written identically by both sides. Without this exclusion K.6's
      # handshake resolution makes each orion worker "publish" to the Vega
      # agent that feeds it — an edge backwards to the message flow.
      not_where: {pattern: kicks_from_queue}
      key: [queue_name]
    consumer:
      node: channel
      key: [queue_name]
    normalizers: [quote_strip]
    match: [exact, normalized]
    edge:
      type: publishes
      id_prefix: broker_queue
      same_service: skip
    unmatched: drop
  # FX.8.14: message-type dispatch, the payload-shape analogue of the two
  # channel contracts above — replaces internal/linker/amqp_message_type.go.
  # Neither repo shares a literal: the producer sets `message_type:
  # MT_CREATE_USER` in the publish payload and the consumer dispatches on
  # `message_hash["message_type"]` against a `when MT_CREATE_USER` branch,
  # each repo defining its own `MT_CREATE_USER = "..."` independently. The
  # shared constant NAME is the one static token both sides agree on
  # (patterns/ruby/amqp_message_type.yaml), so the join is on that name
  # directly — like the queue-name handshake below, agreement on a name is
  # not proof of reachability, so the producer pattern stamps
  # confidence_ceiling=partial at match time (matcher.go) to keep an
  # exact-name match from reading `static`.
  - kind: amqp
    producer:
      node: channel
      where: {pattern: amqp_message_type_pair}
      key: [message_type]
    consumer:
      node: channel
      where: {pattern: amqp_message_type_dispatch}
      key: [message_type]
    match: [exact]
    edge:
      type: publishes
      id_prefix: amqp_message_type
      same_service: skip
    unmatched: drop
