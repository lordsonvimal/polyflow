# contracts/pusher.yaml — ports LinkPusherChannels.
# Matches server-side Pusher.trigger call sites to pusher-js client
# subscriptions on the same channel name. quote_strip handles the surrounding
# quotes that tree-sitter captures; variable-held channels have no quoted
# string value and naturally find no matching consumer (→ ledger).
#
# Two variants cover both pusher_trigger and pusher_trigger_async.
# Consumer is restricted to pusher_subscribe_client (the only subscriber
# pattern that captures a channel name); pusher_channel_bind captures an
# event name instead and is not matched here, matching the bespoke linker.
version: "1"
contracts:
  - kind: pusher
    producer:
      node: publisher
      where: {pattern: pusher_trigger}
      key: [channel]
    consumer:
      node: subscriber
      where: {pattern: pusher_subscribe_client}
      key: [channel]
    normalizers: [quote_strip, dynamic_host_strip]  # dynamic_host_strip is a
                                     # no-op here (channel keys never carry a
                                     # leading "*" host segment); added for
                                     # chain consistency with http.yaml (X.1b).
    match: [exact, normalized]
    edge:
      type: pusher_trigger
      id_prefix: pusher
      same_service: keep
    unmatched: ledger

  - kind: pusher
    producer:
      node: publisher
      where: {pattern: pusher_trigger_async}
      key: [channel]
    consumer:
      node: subscriber
      where: {pattern: pusher_subscribe_client}
      key: [channel]
    normalizers: [quote_strip, dynamic_host_strip]  # dynamic_host_strip is a
                                     # no-op here (channel keys never carry a
                                     # leading "*" host segment); added for
                                     # chain consistency with http.yaml (X.1b).
    match: [exact, normalized]
    edge:
      type: pusher_trigger
      id_prefix: pusher
      same_service: keep
    unmatched: ledger

  # PU.4 — the Rails↔ERB path. PU.2 mints `pusher_trigger_forward` publisher
  # nodes (one per `PusherClient.new(obj, <chan>).notify_x` call site) with a
  # static channel SEGMENT + event; PU.3 mints `pusher_subscribe_erb`
  # subscriber nodes from ERB `pusher_config(channel:, event:)` call sites the
  # same way. The runtime channel is `"#{Rails.env}.<seg>.#{id}"`, so the full
  # string never joins — the segment + the event name are the only static
  # rendezvous. Key on BOTH: two views on one channel listening for different
  # events are different consumers.
  - kind: pusher
    producer:
      node: publisher
      where: {pattern: pusher_trigger_forward}
      key: [channel, event]
    consumer:
      node: subscriber
      where: {pattern: pusher_subscribe_erb}
      key: [channel, event]
    normalizers: [quote_strip]
    match: [exact, normalized]
    edge:
      type: pusher_trigger
      id_prefix: pusher
      same_service: keep
    unmatched: drop

  # The `render "shared/pusher", pusher_channel: ...` partial path carries a
  # channel but no event (the browser binds whatever event the mounted
  # component wants), so it can only key on channel — every producer on that
  # channel is a real sender to this subscriber.
  - kind: pusher
    producer:
      node: publisher
      where: {pattern: pusher_trigger_forward}
      key: [channel]
    consumer:
      node: subscriber
      where: {pattern: pusher_subscribe_erb_channel}
      key: [channel]
    normalizers: [quote_strip]
    match: [exact, normalized]
    edge:
      type: pusher_trigger
      id_prefix: pusher
      same_service: keep
    unmatched: drop
