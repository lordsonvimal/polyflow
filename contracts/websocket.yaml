# contracts/websocket.yaml — ports LinkWebSocketMessages.
# Links typed WebSocket senders ({type: "battery", …}) to the dispatch cases
# handling the same message type, including across services (tether client ↔
# server). quote_strip normalises the surrounding quotes from captured string
# literals; unmatched typed sends go to the ledger.
version: "1"
contracts:
  - kind: websocket
    producer:
      node: publisher
      where: {pattern: ws_send_typed}
      key: [message_type]
    consumer:
      node: subscriber
      where: {pattern: ws_dispatch_case}
      key: [message_type]
    normalizers: [quote_strip]
    match: [exact, normalized]
    edge:
      type: ws_send
      id_prefix: ws
      same_service: keep
    unmatched: ledger

  # H.1: connect-time join — a client `new WebSocket("ws://host/path")`
  # against a server `new WebSocketServer({path: "/path"})`. Path-keyed,
  # mirroring http.yaml's two-variant-per-kind shape (API calls vs. nav
  # links) rather than adding new engine machinery. ws_server_attached/
  # ws_server_noserver (no path captured) are deliberately excluded from
  # `where: {pattern: ...}` — they carry no path key to join on; the
  # matcher stamps them key_dynamic="(attached)" for visibility, but the
  # engine only ledgers dynamic keys on the *producer* side today (a
  # recorded gap shared with H.0's handler-side dynamic path case).
  - kind: websocket
    producer:
      node: http_client
      where: {pattern: ws_new_connection}
      key: [path]
      key_fallbacks: {path: [url]}
      target_service_meta: target_service
    consumer:
      node: subscriber
      where: {pattern: ws_server_new}
      key: [path]
    normalizers: [case_fold, url_to_path, param_wildcard, trim_slash]
    match: [exact, normalized, wildcard_anchored]
    edge:
      type: ws_connect
      id_prefix: wsconn
      same_service: keep
    unmatched: ledger

  # PW.1: connect-time join for route-style WS servers (Go gorilla,
  # Python FastAPI @app.websocket) as opposed to rule 2's Node.js `ws`
  # WebSocketServer shape. Consumer is http_handler (not subscriber) —
  # these patterns are classified that way because the same decorator/
  # route-registration node also carries HTTP-route semantics
  # (classifyPattern's ws_upgrade prefix case). One rule, two exact
  # pattern names OR'd via matchesWhere's "|" list, rather than a new
  # pattern_prefix selector kind — cheaper given only two names exist.
  #
  # Go's ws_upgrade node (the bare `upgrader.Upgrade(w, r, nil)` call
  # site) carries no path of its own, unlike Python's decorator shape;
  # linker.LinkWSUpgradeRoute stamps the registering route's path/method
  # onto it before this rule runs, reusing LinkRouteHandlers' handler
  # resolution. A node that already has a path (Python's shape) is left
  # untouched by that pass.
  - kind: websocket
    producer:
      node: http_client
      where: {pattern: ws_new_connection}
      key: [path]
      key_fallbacks: {path: [url]}
      target_service_meta: target_service
    consumer:
      node: http_handler
      where: {pattern: "ws_upgrade|ws_upgrade_fastapi"}
      key: [path]
    normalizers: [case_fold, url_to_path, param_wildcard, trim_slash]
    match: [exact, normalized, wildcard_anchored]
    edge:
      type: ws_connect
      id_prefix: wsconn
      same_service: keep
    unmatched: ledger
